# Preprocessing only. Model/search/XAI defaults live in optuna.yaml runtime_defaults.
# Tuning creates <dataset>/config.yaml for training, XAI and prediction comparison.
SEED: 32
num_workers: 0
gene_dim: 124
split_ratios:
- 0.7
- 0.15
- 0.15
keep_feature_names: ring,NetRank,HeatDiff,InfoDiff
cutoff_pval: 0.05
knn_neighbours:
- 500
size_negative:
- 5000
corr_threshold:
- 0.33
nedbit_header: 1
quantile_1: 0.05
quantile_2: 0.2
download_raw_data: false
download_preprocessed_data: false
negative_selection_method: seurat
correlation_method: pearson
graph_signal_transform: beta
p_base: ../data_corr_${corr_threshold}_knn_n_${knn_neighbours}_n_neg_${size_negative}/
p_base_files: ${p_base}preprocessed/
p_significant_edges: ${p_base_files}significant_gene_relations.tsv
p_cross_reactive_probes: ${p_raw}cross_reactive_probes.csv
p_significant_edges_with_corr: ${p_base_files}significant_gene_relations_with_corr.tsv
p_merged_signals: ${p_base_files}merged_signals_bc.csv
p_seed_features: ${p_base_files}seed_features.csv
p_out_links: ${p_base_files}out_links_bc.csv
p_out_genes: ${p_base_files}out_genes_bc.csv
p_out_gene_rankings: ${p_base_files}out_gene_rankings_bc.csv
p_nedbit_features: ${p_base_files}nedbit_features_bc.csv
p_split_manifest: ${p_base_files}node_split_manifest_bc.csv
p_combined_pos_neg_signals: ${p_base_files}combined_pos_neg_signals_bc.csv
p_arrays: ${p_raw}GSE66695_matrix_processed.txt.gz
p_mapper: ${p_raw}probe_genes.csv
p_snp_probes: ${p_raw}snp_7998probes.vh20151030.txt
p_platform: ${p_raw}GPL13534_platform.csv
p_seeds: ${p_raw}seed_probes.csv
p_raw_data: null
p_processed_data: null
p_raw: ../raw/
p_preprocessing_manifest: ${p_base_files}seed_preprocessing_manifest.json
dataset_id: GSE66695
p_sample_metadata: ${p_raw}sample_metadata.tsv
n_bc_samples: 80
n_normal_samples: 40
config_scope: preprocessing
