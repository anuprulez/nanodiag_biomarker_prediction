# Search settings: each dataset configuration and model gets its own study.
models: ["PNA", "GCN", "GraphSAGE", "GATv2", "GraphTransformer", "TabPFN", "TabICL", "XGBoost"]
n_trials: 25 # Additional trials per invocation, per model and dataset
metric: macro_f1 # macro_f1 or accuracy, always on validation nodes
startup_trials: 20
pruning_warmup_epochs: 5
# Epoch budget and patience are taken from config.yaml.
spaces:
  GNN:
    batch_size: {type: categorical, choices: [64, 128, 256, 512]}
    grad_clip_norm: {type: float, low: 0.5, high: 5.0, log: true}
    hidden_dim: {type: categorical, choices: [32, 64, 128, 256]}
    learning_rate: {type: float, low: 0.00005, high: 0.006, log: true}
    weight_decay: {type: float, low: 0.000001, high: 0.05, log: true}
    dropout: {type: float, low: 0.0, high: 0.65}
    gnn_layers: {type: int, low: 1, high: 3}
    # Per-hop sampling templates, truncated to gnn_layers.
    neighbors_spread:
      type: categorical
      choices: [[10], [40], [10, 5], [10, 5, 5], [5, 5], [20,10], [40,10], [80, 20]]
    embedding_dropout: {type: float, low: 0.0, high: 0.25}
    feature_dropout: {type: float, low: 0.0, high: 0.2}
  GATv2:
    heads: {type: categorical, choices: [1, 2, 4, 8]}
  GraphTransformer:
    heads: {type: categorical, choices: [1, 2, 4, 8]}
  XGBoost:
    n_estimators: {type: int, low: 200, high: 2000, step: 100}
    max_depth: {type: int, low: 3, high: 10}
    learning_rate: {type: float, low: 0.005, high: 0.3, log: true}
    min_child_weight: {type: float, low: 0.1, high: 30.0, log: true}
    subsample: {type: float, low: 0.5, high: 1.0}
    colsample_bytree: {type: float, low: 0.5, high: 1.0}
    gamma: {type: float, low: 0.0, high: 5.0}
    reg_alpha: {type: float, low: 0.00000001, high: 10.0, log: true}
    reg_lambda: {type: float, low: 0.000001, high: 100.0, log: true}
    max_bin: {type: categorical, choices: [128, 256, 512]}
  # Optional foundation-model inference searches; enable via --models.
  TabPFN:
    n_estimators: {type: categorical, choices: [4, 8, 16, 32]}
    softmax_temperature: {type: float, low: 0.5, high: 1.5}
    balance_probabilities: {type: categorical, choices: [false, true]}
    average_before_softmax: {type: categorical, choices: [false, true]}
  TabICL:
    n_estimators: {type: categorical, choices: [4, 8, 16, 32]}
    softmax_temperature: {type: float, low: 0.5, high: 1.5}
    outlier_threshold: {type: float, low: 2.0, high: 8.0}
    feat_shuffle_method: {type: categorical, choices: [latin, random]}
    class_shuffle_method: {type: categorical, choices: [shift, none]}
    average_logits: {type: categorical, choices: [false, true]}
